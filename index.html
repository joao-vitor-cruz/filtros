<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Filtros</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <main class="app" data-state="loading">
      <!-- O vídeo é só a fonte dos frames; o canvas mostra a imagem filtrada.
           Sem WebGL, o próprio vídeo aparece como preview. -->
      <video class="source" aria-hidden="true" playsinline muted autoplay></video>
      <canvas class="preview" role="img" aria-label="Imagem da câmera"></canvas>
      <output class="fps" id="fps" hidden></output>

      <div class="filter-toast" id="filter-toast" aria-live="polite">
        <span class="filter-swatch" id="filter-swatch"></span>
        <span id="filter-name"></span>
      </div>

      <header class="top-bar">
        <button class="icon-btn" id="open-settings" type="button" aria-label="Ajustes">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 7h10M18 7h2M4 17h4M12 17h8" />
            <circle cx="16" cy="7" r="2" />
            <circle cx="10" cy="17" r="2" />
          </svg>
        </button>
        <button class="icon-btn" id="switch-camera" type="button" aria-label="Trocar câmera" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M20 7h-3.2l-1.6-2H8.8L7.2 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2Z" />
            <path d="M9 13.5a3 3 0 0 1 5.1-2.1M15 13.5a3 3 0 0 1-5.1 2.1" />
            <path d="M14.5 9.6v1.9h-1.9M9.5 17.4v-1.9h1.9" />
          </svg>
        </button>
        <button class="icon-btn" id="gallery-close" type="button" aria-label="Voltar para a câmera" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" /></svg>
        </button>
      </header>

      <div class="status" id="loading" role="status">
        <div class="spinner" aria-hidden="true"></div>
        <p>Abrindo a câmera…</p>
      </div>

      <section class="status" id="error" role="alert" hidden>
        <h1 id="error-title"></h1>
        <p id="error-message"></p>
        <button class="primary-btn" id="retry" type="button">Tentar novamente</button>
        <button class="ghost-btn" id="error-gallery" type="button">Usar uma foto da galeria</button>
      </section>

      <footer class="bottom-bar">
        <label class="intensity" id="intensity-row">
          <span class="intensity-label">Intensidade</span>
          <input id="intensity" type="range" min="0" max="100" step="1" value="100" />
          <output id="intensity-value" for="intensity">100%</output>
        </label>
        <div class="palette-picker" id="palette-picker"></div>
        <div class="capture-mode" id="capture-mode" role="radiogroup" aria-label="Modo de captura" hidden>
          <button type="button" role="radio" aria-checked="true" data-mode="photo">Foto</button>
          <button type="button" role="radio" aria-checked="false" data-mode="video">Vídeo</button>
        </div>
        <div class="shutter-row">
          <button class="icon-btn gallery-btn" id="open-gallery" type="button" aria-label="Escolher foto da galeria">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <rect x="3" y="4" width="18" height="16" rx="3" />
              <circle cx="9" cy="10" r="1.8" />
              <path d="M21 16l-5-5-8 9" />
            </svg>
          </button>
          <button class="shutter" id="shutter" type="button" aria-label="Tirar foto" disabled></button>
          <button class="primary-btn gallery-save" id="gallery-save" type="button" hidden>Salvar</button>
        </div>
        <input id="gallery-input" type="file" accept="image/*" hidden />
      </footer>

      <div class="rec-timer" id="rec-timer" role="timer" aria-live="off" hidden>
        <span class="rec-dot" aria-hidden="true"></span><span id="rec-time">00:00</span>
      </div>

      <div class="flash" id="flash" aria-hidden="true"></div>

      <section class="review" id="review" aria-label="Foto tirada" hidden>
        <img class="review-image" id="review-image" alt="Foto tirada com o filtro" />
        <video class="review-image" id="review-video" playsinline loop muted hidden></video>
        <header class="top-bar review-top">
          <button class="icon-btn" id="review-close" type="button" aria-label="Voltar para a câmera sem salvar">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" /></svg>
          </button>
          <button class="icon-btn" id="review-sound" type="button" aria-pressed="false" aria-label="Ouvir o som do vídeo" hidden>
            <svg class="sound-off" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z" /><path d="M17 9l4 6M21 9l-4 6" /></svg>
            <svg class="sound-on" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z" /><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12" /></svg>
          </button>
        </header>
        <footer class="review-actions">
          <button class="primary-btn save-btn" id="save" type="button">Salvar</button>
        </footer>
      </section>

      <section class="sheet" id="editor" role="dialog" aria-modal="true" aria-labelledby="editor-title" hidden>
        <form class="sheet-body" novalidate>
          <header class="sheet-header">
            <h2 id="editor-title" tabindex="-1">Nova paleta</h2>
            <button class="icon-btn small" id="editor-cancel" type="button" aria-label="Cancelar">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" /></svg>
            </button>
          </header>

          <div class="editor-gradient" id="editor-gradient" aria-hidden="true"></div>

          <label class="field">
            <span>Nome</span>
            <input id="editor-name" type="text" autocomplete="off" enterkeyhint="done" placeholder="Minha paleta" />
          </label>

          <div class="field">
            <span>Ícone</span>
            <div class="icon-row">
              <span class="icon-preview" id="editor-icon-preview" aria-hidden="true"></span>
              <button class="ghost-btn compact" id="editor-icon-pick" type="button">Escolher foto</button>
              <button class="ghost-btn compact danger" id="editor-icon-remove" type="button" hidden>Remover</button>
            </div>
            <input id="editor-icon-input" type="file" accept="image/*" hidden />
          </div>

          <fieldset class="field">
            <legend>Modo</legend>
            <div class="mode-options" id="editor-modes"></div>
          </fieldset>

          <div class="field">
            <span id="editor-colors-label">Cores <small>(da sombra para a luz)</small></span>
            <ol class="color-list" id="editor-colors" aria-labelledby="editor-colors-label"></ol>
            <button class="ghost-btn" id="editor-add" type="button">+ Adicionar cor</button>
          </div>

          <footer class="sheet-actions">
            <button class="ghost-btn danger" id="editor-delete" type="button">Excluir</button>
            <button class="primary-btn" id="editor-save" type="submit">Salvar paleta</button>
          </footer>
        </form>
        <div class="cropper" id="icon-cropper" role="dialog" aria-modal="true" aria-labelledby="cropper-title" hidden>
          <h3 id="cropper-title" tabindex="-1">Enquadrar ícone</h3>
          <p class="sheet-hint">Arraste a foto para enquadrar.</p>
          <div class="cropper-view" id="cropper-view"></div>
          <label class="cropper-zoom">
            <span>Zoom</span>
            <input id="cropper-zoom" type="range" min="100" max="400" step="1" value="100" />
          </label>
          <div class="cropper-actions">
            <button class="ghost-btn compact" id="cropper-cancel" type="button">Cancelar</button>
            <button class="primary-btn compact" id="cropper-use" type="button">Usar foto</button>
          </div>
        </div>
      </section>

      <section class="sheet edit-sheet" id="settings" role="dialog" aria-modal="true" aria-labelledby="settings-title" hidden>
        <div class="sheet-body">
          <header class="sheet-header">
            <h2 id="settings-title" tabindex="-1">Ajustes</h2>
            <div class="sheet-header-actions">
              <button class="ghost-btn compact" id="settings-reset" type="button">Restaurar</button>
              <button class="primary-btn compact" id="settings-done" type="button">Pronto</button>
            </div>
          </header>
          <div class="edit-tabs" id="edit-tabs" role="tablist" aria-label="Grupos de ajustes"></div>
          <div class="edit-panels" id="edit-panels">
            <div class="edit-panel" id="tab-more" role="tabpanel" hidden>
              <label class="switch-row">
                <span>
                  Espelhar fotos da câmera frontal
                  <small>Como aparece na tela, igual a um espelho</small>
                </span>
                <input id="settings-mirror" type="checkbox" role="switch" />
              </label>
              <section class="palette-transfer" aria-labelledby="transfer-title">
                <h3 id="transfer-title">Minhas paletas</h3>
                <p class="sheet-hint" id="transfer-hint"></p>
                <div class="transfer-actions">
                  <button class="ghost-btn compact" id="export-palettes" type="button">Exportar</button>
                  <button class="ghost-btn compact" id="import-palettes" type="button">Importar</button>
                </div>
                <input id="import-input" type="file" accept=".json,application/json" hidden />
              </section>
            </div>
          </div>
        </div>
        <div class="help-card" id="help" role="dialog" aria-modal="true" aria-labelledby="help-title" hidden>
          <h3 id="help-title" tabindex="-1"></h3>
          <p id="help-what"></p>
          <p class="help-in-app"><strong>Neste app</strong> <span id="help-in-app"></span></p>
          <button class="primary-btn compact" id="help-close" type="button">Entendi</button>
        </div>
      </section>

      <p class="notice" id="notice" role="status"></p>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
