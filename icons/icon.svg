<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2b0f54"/>
      <stop offset="0.55" stop-color="#ab1f65"/>
      <stop offset="1" stop-color="#ff4f69"/>
    </linearGradient>
    <linearGradient id="lens" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#90e0ef"/>
      <stop offset="0.5" stop-color="#ffbe0b"/>
      <stop offset="1" stop-color="#ff006e"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <!-- Escala do desenho: 1 no ícone comum; o ícone "maskable" usa 0.72 para caber na área segura. -->
  <g transform="translate(256 256) scale(SCALE) translate(-256 -256)">
    <rect x="96" y="150" width="320" height="236" rx="48" fill="none" stroke="#fff" stroke-width="28"/>
    <rect x="186" y="104" width="140" height="56" rx="18" fill="#fff"/>
    <circle cx="256" cy="268" r="74" fill="url(#lens)" stroke="#fff" stroke-width="24"/>
    <circle cx="364" cy="198" r="14" fill="#fff"/>
  </g>
</svg>
